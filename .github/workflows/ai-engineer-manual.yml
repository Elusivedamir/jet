name: AI Engineer (manual)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Focused engineering task for the agent"
        required: true
        type: string
      base_branch:
        description: "Approved project branch to base the agent work on"
        required: true
        default: "project/greenfield-reset"
        type: string

permissions:
  contents: read

concurrency:
  group: ai-engineer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    environment: ai-engineering
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 20
    steps:
      - name: Check API credential
        id: preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI execution skipped safely. Configure OPENAI_API_KEY only after setting provider-side usage limits."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate target branch
        if: steps.preflight.outputs.enabled == 'true'
        env:
          REQUESTED_BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_BASE" = "main" ]; then
            echo "Refusing to target main."
            exit 1
          fi
          case "$REQUESTED_BASE" in
            project/greenfield-reset|research/*|work/*|fix/*) ;;
            *) echo "Base branch must be an approved project/feature/fix branch."; exit 1 ;;
          esac

      - name: Checkout approved base
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Create isolated agent branch
        if: steps.preflight.outputs.enabled == 'true'
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="agent/auto-${RUN_ID}"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Run Codex
        if: steps.preflight.outputs.enabled == 'true'
        id: codex
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            First read README.md, docs/governance/MASTER_PROMPT.md, docs/governance/BRANCHING_STRATEGY.md, docs/governance/REPOSITORY_INVENTORY.md and docs/product/BUSINESS_PLAN_BASELINE.md. The owner-supplied complete business-plan text is structured in BUSINESS_PLAN_BASELINE.md and is the current working product baseline. The canonical PDF remains preserved; byte-for-byte extraction comparison is a separate verification task. Do not change product scope or business terms.
            Owner task:
            ${{ inputs.task }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          output-file: ${{ runner.temp }}/codex-report.md

      - name: Validate patch
        if: steps.preflight.outputs.enabled == 'true'
        id: validate
        run: |
          set -euo pipefail
          git add -N .
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Agent made no repository changes; no PR will be created."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
            git diff --stat
          fi

      - name: Commit and push isolated branch
        if: steps.validate.outputs.changed == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent: focused engineering change"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open draft pull request
        if: steps.validate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr create --draft \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "AI Engineer: automated focused change (run $RUN_ID)" \
            --body-file "${{ runner.temp }}/codex-report.md"

      - name: Upload agent report
        if: steps.preflight.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-report-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-report.md
          if-no-files-found: ignore

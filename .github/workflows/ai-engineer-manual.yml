name: AI Engineer (manual)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Focused engineering task for the agent"
        required: true
        type: string
      base_branch:
        description: "Approved project branch to base the agent work on"
        required: true
        default: "project/foundation-and-juggleim-poc"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-engineer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check API credential
        id: preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI execution skipped safely. Configure OPENAI_API_KEY only after setting provider-side usage limits."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate target branch
        if: steps.preflight.outputs.enabled == 'true'
        env:
          REQUESTED_BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_BASE" = "main" ]; then
            echo "Refusing to target main."
            exit 1
          fi
          case "$REQUESTED_BASE" in
            project/*|feature/*|fix/*) ;;
            *) echo "Base branch must be an approved project/feature/fix branch."; exit 1 ;;
          esac

      - name: Checkout approved base
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Create isolated agent branch
        if: steps.preflight.outputs.enabled == 'true'
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="agent/auto-${RUN_ID}"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Run Codex
        if: steps.preflight.outputs.enabled == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            First read and obey .github/codex/prompts/engineering-agent.md and docs/agent/AGENT_RULES.md.
            Owner task:
            ${{ inputs.task }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: ${{ runner.temp }}/codex-report.md

      - name: Validate patch
        if: steps.preflight.outputs.enabled == 'true'
        id: validate
        run: |
          set -euo pipefail
          git add -N .
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Agent made no repository changes; no PR will be created."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
            git diff --stat
          fi

      - name: Commit and push isolated branch
        if: steps.validate.outputs.changed == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent: focused engineering change"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open draft pull request
        if: steps.validate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr create --draft \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "AI Engineer: automated focused change (run $RUN_ID)" \
            --body-file "${{ runner.temp }}/codex-report.md"

      - name: Upload agent report
        if: steps.preflight.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-report-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-report.md
          if-no-files-found: ignore

name: Android PoC - emulator smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-poc-emulator-smoke
  cancel-in-progress: false
jobs:
  emulator-smoke:
    name: Build, install and launch on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: project/foundation-and-juggleim-poc
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android/poc
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r android/poc/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.jetson.poc/.MainActivity
            adb shell dumpsys activity activities | grep -F "com.jetson.poc/.MainActivity"
      - name: Upload emulator-tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jetson-android-poc-emulator-tested
          path: android/poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

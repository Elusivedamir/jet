name: Android PoC - build and unit tests
on:
  push:
    branches:
      - project/foundation-and-juggleim-poc
    paths:
      - "android/poc/**"
      - ".github/workflows/android-poc.yml"
      - ".github/workflows/android-emulator-smoke.yml"
  pull_request:
    paths:
      - "android/poc/**"
      - ".github/workflows/android-poc.yml"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-poc-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, unit tests and APK artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed
      - name: Build debug APK
        working-directory: android/poc
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Run unit tests
        working-directory: android/poc
        run: |
          # Alice and Bob are separate product flavors; run both test tasks explicitly.
          gradle --no-daemon --stacktrace \
            :app:testAliceDebugUnitTest \
            :app:testBobDebugUnitTest
      - name: Verify APK output
        run: |
          test -s android/poc/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/poc/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/poc/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jetson-android-poc-debug
          path: android/poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

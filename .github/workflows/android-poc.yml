name: Android PoC
on:
  push:
    branches:
      - project/foundation-and-juggleim-poc
    paths:
      - "android/poc/**"
      - ".github/workflows/android-poc.yml"
  pull_request:
    paths:
      - "android/poc/**"
      - ".github/workflows/android-poc.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-poc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and unit test Android PoC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed
      - name: Build debug APK
        working-directory: android/poc
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Run unit tests
        working-directory: android/poc
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jetson-android-poc-debug
          path: android/poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

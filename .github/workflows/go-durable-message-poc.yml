name: Go durable-message PoC
on:
  push:
    branches:
      - "poc/realtime-delivery-and-polyglot-2026-11-27"
    paths:
      - "poc/go-server/**"
      - "poc/shared/**"
      - ".github/workflows/go-durable-message-poc.yml"
  pull_request:
    paths:
      - "poc/go-server/**"
      - "poc/shared/**"
      - ".github/workflows/go-durable-message-poc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jetson
          POSTGRES_PASSWORD: jetson_test_only
          POSTGRES_DB: jetson_poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetson -d jetson_poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: poc/go-server
    env:
      TEST_DATABASE_URL: postgres://jetson:jetson_test_only@localhost:5432/jetson_poc?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
          cache-dependency-path: |
            poc/go-server/go.mod
            poc/go-server/go.sum
      - name: Resolve patched dependency graph and generate checksums
        run: |
          go mod tidy
          go mod verify
          test -s go.sum
          git diff --exit-code -- go.mod go.sum
          git diff -- go.mod go.sum > /tmp/go-module-metadata.diff || true
          cat /tmp/go-module-metadata.diff
      - name: Format and static analysis
        run: |
          files="$(gofmt -l *.go)"
          if [ -n "$files" ]; then printf "%s\\n" "$files"; exit 1; fi
          go vet ./...
      - name: PostgreSQL integration and race tests
        run: go test -race -count=100 -v ./...
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Build direct server executable
        run: go build -trimpath -ldflags="-buildid=" -o /tmp/jet-go-server .
      - name: Hard crash/restart, shared contract and benchmark
        env:
          LISTEN_ADDR: ":8080"
        run: |
          python3 ../../poc/shared/crash_recovery_harness.py \
            --database-url "$TEST_DATABASE_URL" \
            --base-url http://127.0.0.1:8080 \
            --contract-harness ../../poc/shared/contract_harness.py \
            --output /tmp/go-crash-recovery.json \
            --log /tmp/jet-go-server.log \
            --rounds 5 --per-round 100 \
            --server-command /tmp/jet-go-server
      - name: Supply-chain vulnerability and license scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./... > /tmp/go-vulnerability-scan.txt
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./... --ignore=github.com/elusivedamir/jet/poc/go-server --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,0BSD
          go-licenses report ./... --ignore=github.com/elusivedamir/jet/poc/go-server > /tmp/go-license-report.csv
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
          cyclonedx-gomod mod -json -output /tmp/go-sbom.json
      - name: Trivy filesystem vulnerability and license report
        run: |
          docker run --rm -v "$PWD:/workspace" -v /tmp:/reports aquasec/trivy:0.58.2 fs --scanners vuln,license --exit-code 1 --severity HIGH,CRITICAL --format json --output /reports/go-trivy-report.json /workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-message-poc-evidence
          path: |
            /tmp/go-crash-recovery.json
            /tmp/jet-go-server.log
            /tmp/go-vulnerability-scan.txt
            /tmp/go-license-report.csv
            /tmp/go-sbom.json
            /tmp/go-trivy-report.json
            poc/go-server/go.sum
            /tmp/go-module-metadata.diff

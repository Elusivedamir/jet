name: JuggleIM Android transport probe

on:
  push:
    branches:
      - project/foundation-and-juggleim-poc
    paths:
      - "android/poc/**"
      - "deploy/juggleim-poc/**"
      - ".github/workflows/juggleim-transport-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juggleim-transport-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Verify Android TLS and WebSocket Upgrade only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "system-images;android-34;google_apis;x86_64"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Start isolated JuggleIM server
        run: bash deploy/juggleim-poc/scripts/bootstrap.sh

      - name: Build Bob debug APK
        working-directory: android/poc
        run: gradle --no-daemon --stacktrace :app:assembleBobDebug -PjuggleAppKey="${JUGGLE_APP_KEY:?missing}" -PjuggleWssUrl="${JUGGLE_WSS_URL:?missing}"

      - name: Enable Android emulator KVM acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::warning::KVM unavailable; emulator will use software CPU emulation."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Run TLS and WebSocket Upgrade probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -writable-system
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash deploy/juggleim-poc/scripts/run-android-transport-probe.sh

      - name: Upload transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juggleim-transport-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/transport-probe/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down isolated JuggleIM environment
        if: always()
        run: docker compose -f deploy/juggleim-poc/docker-compose.yml down -v --remove-orphans || true

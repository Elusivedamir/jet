name: Kotlin Spring message PoC
on:
  pull_request:
    paths:
      - "poc/kotlin-server/**"
      - ".github/workflows/kotlin-message-poc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jetson
          POSTGRES_PASSWORD: jetson_test_only
          POSTGRES_DB: jetson_poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetson -d jetson_poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: poc/kotlin-server
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jetson_poc
      SPRING_DATASOURCE_USERNAME: jetson
      SPRING_DATASOURCE_PASSWORD: jetson_test_only
      TEST_DATABASE_URL: postgres://jetson:jetson_test_only@localhost:5432/jetson_poc?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and run PostgreSQL integration tests
        run: mvn -B test

      - name: Install PostgreSQL client and seed black-box fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE delivery_receipts, recipient_inbox, delivery_outbox, messages, conversation_counters, conversation_members, conversations CASCADE;
          INSERT INTO conversations(id) VALUES ('room-a'), ('room-b');
          INSERT INTO conversation_members(conversation_id, account_id) VALUES
           ('room-a','alice'), ('room-a','bob'), ('room-b','alice'), ('room-b','carol');
          SQL
      - name: Start Kotlin Spring server
        env:
          SERVER_PORT: "8082"
        run: |
          nohup mvn -B spring-boot:run >/tmp/jet-kotlin.log 2>&1 &
          echo $! >/tmp/jet-kotlin.pid
          for i in {1..90}; do
            if curl -sf http://127.0.0.1:8082/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jet-kotlin.log
          exit 1
      - name: Shared HTTP/SSE contract and five-round latency probe
        run: set -o pipefail; python3 ../../poc/shared/contract_harness.py --base-url http://127.0.0.1:8082 --rounds 5 --per-round 100 | tee /tmp/kotlin-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-message-poc-results
          path: /tmp/kotlin-results.json

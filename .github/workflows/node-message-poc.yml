name: Node TypeScript message PoC
on:
  pull_request:
    paths:
      - "poc/node-server/**"
      - "poc/shared/**"
      - ".github/workflows/node-message-poc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jetson
          POSTGRES_PASSWORD: jetson_test_only
          POSTGRES_DB: jetson_poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetson -d jetson_poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: poc/node-server
    env:
      TEST_DATABASE_URL: postgres://jetson:jetson_test_only@localhost:5432/jetson_poc?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap lockfile and install from it
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --no-audit --no-fund
      - name: Build and PostgreSQL integration tests
        run: npm test
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Build direct server executable
        run: npm run build
      - name: Hard crash/restart, shared contract and benchmark
        env:
          PORT: "8081"
        run: |
          python3 ../../poc/shared/crash_recovery_harness.py \
            --database-url "$TEST_DATABASE_URL" \
            --base-url http://127.0.0.1:8081 \
            --contract-harness ../../poc/shared/contract_harness.py \
            --output /tmp/node-crash-recovery.json \
            --log /tmp/jet-node-server.log \
            --rounds 5 --per-round 100 \
            --server-command node dist/src/server.js
      - name: Dependency audit and license inventory
        run: |
          npm audit --json > /tmp/node-npm-audit.json || true
          npx --yes license-checker@25.0.1 --json --out /tmp/node-license-report.json
          npx --yes @cyclonedx/cyclonedx-npm@1.19.0 --output-file /tmp/node-sbom.json
      - uses: aquasecurity/setup-trivy@v0.2.3
      - name: Trivy filesystem vulnerability and license report
        run: trivy fs --scanners vuln,license --format json --output /tmp/node-trivy-report.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-message-poc-evidence
          path: |
            /tmp/node-crash-recovery.json
            /tmp/jet-node-server.log
            /tmp/node-npm-audit.json
            /tmp/node-license-report.json
            /tmp/node-sbom.json
            /tmp/node-trivy-report.json
            poc/node-server/package-lock.json

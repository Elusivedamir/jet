name: PostgreSQL adapter contract tests

on:
  push:
    branches:
      - engineering/postgres-adapter-poc
  pull_request:
    branches:
      - project/greenfield-reset
    paths:
      - "tests/postgres_adapter/**"
      - "docs/research/PERSISTENCE_ADAPTER_COMPARISON.md"
      - ".github/workflows/postgres-adapter-tests.yml"

permissions:
  contents: read

concurrency:
  group: postgres-adapter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-adapter:
    name: PostgreSQL 16 contract integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jetson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jetson_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/jetson_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install -r tests/postgres_adapter/requirements.txt
      - name: Compile adapter and tests
        run: python -m compileall -q tests/postgres_adapter
      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s tests/postgres_adapter -p 'test_*.py' -v

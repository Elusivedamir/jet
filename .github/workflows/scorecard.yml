name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Repository supply-chain posture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard without publishing results
        uses: ossf/scorecard-action@df56f2da613afd0cc697279be0dc6885df9bce34 # pinned upstream commit, reviewed 2026-11-27
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

# CI for the in-memory contract oracle and SQLite adapter experiment.
name: Message reliability and SQLite adapter tests

on:
  push:
    branches:
      - engineering/sqlite-durability-experiment
      - engineering/outbox-retry-dedup
      - engineering/message-reference-model
      - engineering/outbox-retry-dedup
      - integration/message-reliability
      - project/greenfield-reset
      - engineering/adapter-contract-harness
  pull_request:
    branches:
      - engineering/message-reference-model
      - research/architecture-synthesis-task
      - project/greenfield-reset
    paths:
      - "tests/reference_model/**"
      - "tests/sqlite_adapter/**"
      - "tests/postgres_adapter/**"
      - ".github/workflows/sqlite-adapter-tests.yml"

permissions:
  contents: read

concurrency:
  group: message-reliability-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  message-reliability:
    name: Python standard-library reliability tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source and tests
        run: python -m compileall -q tests/reference_model tests/sqlite_adapter tests/postgres_adapter
      - name: Run reference model tests
        run: python -m unittest discover -s tests/reference_model -p 'test_*.py' -v
      - name: Run SQLite adapter tests
        run: python -m unittest discover -s tests/sqlite_adapter -p 'test_*.py' -v

  postgres-adapter:
    name: PostgreSQL adapter contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jetson
          POSTGRES_PASSWORD: jetson_test_only
          POSTGRES_DB: jetson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetson -d jetson_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.6"
      - name: Compile PostgreSQL adapter
        run: python -m compileall -q tests/postgres_adapter
      - name: Run PostgreSQL adapter tests
        env:
          POSTGRES_DSN: postgresql://jetson:jetson_test_only@127.0.0.1:5432/jetson_test
        run: python -m unittest discover -s tests/postgres_adapter -p 'test_*.py' -v

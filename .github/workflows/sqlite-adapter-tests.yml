# CI for the in-memory contract oracle and SQLite adapter experiment.
name: Message reliability and SQLite adapter tests

on:
  push:
    branches:
      - engineering/sqlite-durability-experiment
      - engineering/outbox-retry-dedup
      - engineering/message-reference-model
      - engineering/outbox-retry-dedup
      - integration/message-reliability
      - project/greenfield-reset
      - engineering/adapter-contract-harness
      - engineering/shared-adapter-conformance
      - engineering/postgres-migration-backup
      - engineering/persistence-benchmark-rebased
      - engineering/postgres-pool-comparison-rebased
      - engineering/persistence-concurrency-stress
      - engineering/persistence-workload-baseline
  pull_request:
    branches:
      - engineering/message-reference-model
      - research/architecture-synthesis-task
      - project/greenfield-reset
    paths:
      - "tests/reference_model/**"
      - "tests/sqlite_adapter/**"
      - "tests/postgres_adapter/**"
      - "tests/benchmarks/**"
      - ".github/workflows/sqlite-adapter-tests.yml"

permissions:
  contents: read

concurrency:
  group: message-reliability-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  message-reliability:
    name: Python standard-library reliability tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source and tests
        run: python -m compileall -q adapter_contract tests/reference_model tests/sqlite_adapter tests/postgres_adapter tests/benchmarks
      - name: Run reference model tests
        run: python -m unittest discover -s tests/reference_model -p 'test_*.py' -v
      - name: Run SQLite adapter tests
        run: python -m unittest discover -s tests/sqlite_adapter -p 'test_*.py' -v

  postgres-adapter:
    name: PostgreSQL adapter contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jetson
          POSTGRES_PASSWORD: jetson_test_only
          POSTGRES_DB: jetson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetson -d jetson_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.6" "psycopg-pool==3.2.6"
      - name: Compile PostgreSQL adapter
        run: python -m compileall -q tests/postgres_adapter tests/benchmarks
      - name: Run PostgreSQL adapter tests
        env:
          POSTGRES_DSN: postgresql://jetson:jetson_test_only@127.0.0.1:5432/jetson_test
        run: python -m unittest discover -s tests/postgres_adapter -p 'test_*.py' -v
      - name: Prepare disposable backup fixture
        env:
          POSTGRES_DSN: postgresql://jetson:jetson_test_only@127.0.0.1:5432/jetson_test
        run: python tests/postgres_adapter/backup_restore_check.py prepare
      - name: Dump and restore disposable PostgreSQL database
        run: |
          set -euo pipefail
          container_id="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:16" {print $1; exit}')"
          test -n "$container_id"
          docker exec "$container_id" pg_dump -U jetson -d jetson_test -Fc -f /tmp/jetson-backup.dump
          docker exec "$container_id" createdb -U jetson jetson_restore_test
          docker exec "$container_id" pg_restore -U jetson -d jetson_restore_test /tmp/jetson-backup.dump
      - name: Verify restored PostgreSQL state
        env:
          POSTGRES_RESTORE_DSN: postgresql://jetson:jetson_test_only@127.0.0.1:5432/jetson_restore_test
        run: python tests/postgres_adapter/backup_restore_check.py verify
      - name: Run small serial persistence comparison
        env:
          POSTGRES_DSN: postgresql://jetson:jetson_test_only@127.0.0.1:5432/jetson_test
          JET_BENCH_MESSAGES: "100"
          JET_BENCH_TRIALS: "5"
        run: python tests/benchmarks/persistence_workload_baseline.py
      - name: Upload persistence benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: persistence-benchmark-${{ github.sha }}
          path: persistence-benchmark.json
          if-no-files-found: error
      - name: Run concurrent persistence correctness smoke test
        env:
          POSTGRES_DSN: postgresql://jetson:jetson_test_only@127.0.0.1:5432/jetson_test
          JET_STRESS_MESSAGES: "40"
        run: python tests/benchmarks/concurrent_persistence_stress.py
      - name: Upload concurrent persistence report
        uses: actions/upload-artifact@v4
        with:
          name: persistence-concurrency-${{ github.sha }}
          path: persistence-concurrency-stress.json
          if-no-files-found: error

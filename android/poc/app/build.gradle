plugins {
    id "com.android.application"
}
def configuredAppKey = providers.gradleProperty("juggleAppKey").orElse("").get()
def configuredWssUrl = providers.gradleProperty("juggleWssUrl").orElse("").get()
def asBuildConfigString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace "com.jetson.poc"
    compileSdk 35
    defaultConfig {
        applicationId "com.jetson.poc"
        // PoC-only baseline; final Jetson minimum Android API remains undecided.
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0-poc"
        buildConfigField "String", "JUGGLE_APP_KEY", asBuildConfigString(configuredAppKey)
        buildConfigField "String", "JUGGLE_WSS_URL", asBuildConfigString(configuredWssUrl)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    flavorDimensions += "pocUser"
    productFlavors {
        alice {
            dimension "pocUser"
            applicationIdSuffix ".alice"
            versionNameSuffix "-alice"
        }
        bob {
            dimension "pocUser"
            applicationIdSuffix ".bob"
            versionNameSuffix "-bob"
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation "com.juggle.im:juggle:1.9.0"
    implementation "org.java-websocket:Java-WebSocket:1.5.5"
    implementation "com.google.protobuf:protobuf-javalite:3.18.0"
    implementation "com.qiniu:qiniu-android-sdk:8.7.0"
    testImplementation "junit:junit:4.13.2"
}
